[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "command-os-core"
version = "2.0.0b1"
description = "Command language and runtime for AI orchestration"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["runtime", "runtime.adapters", "runtime.production"]

[project.scripts]
command-os = "runtime.cli:main"
command-os-api = "runtime.service_cli:main"

[tool.setuptools.package-data]
runtime = ["data/policies/*.json", "data/registry/*.json"]
