[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "command-os-core"
version = "2.0.0a5"
description = "Command language and runtime for AI orchestration"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["runtime", "runtime.adapters", "runtime.production"]
