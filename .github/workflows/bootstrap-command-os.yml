name: Bootstrap COMMAND OS

on:
  push:
    branches:
      - command-os/v2-alpha3

permissions:
  contents: write

jobs:
  unpack:
    if: contains(github.event.head_commit.message, 'assemble source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and unpack COMMAND OS source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, shutil, zipfile
          bundle = Path('bundle')
          parts = sorted(bundle.glob('part-*.txt'))
          if not parts:
              raise SystemExit('No bundle parts found')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          archive = bundle / 'source.zip'
          archive.write_bytes(base64.b64decode(encoded))
          with zipfile.ZipFile(archive) as z:
              z.extractall('.')
          shutil.rmtree(bundle)
          Path('.github/workflows/bootstrap-command-os.yml').unlink()
          Path('TRIGGER.md').unlink(missing_ok=True)
          PY
      - name: Commit unpacked source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: unpack COMMAND OS CORE v2 alpha.3"
          git push origin HEAD:${GITHUB_REF_NAME}
