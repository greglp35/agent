name: COMMAND OS CI

on:
  push:
    branches: [main, "command-os/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run runtime tests
        run: python -m unittest discover -s tests/runtime -p "test_*.py" -v
      - name: Validate JSON registries
        run: |
          python - <<'PY2'
          from pathlib import Path
          import json
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY2
